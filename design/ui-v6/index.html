<!DOCTYPE html>
<html lang="zh-CN" data-theme="berry">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>织章 StoryWeave — 全画布小说创作工作台原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="focusExitBtn" class="btn btn-soft focus-exit" type="button">退出专注 · Esc</button>

  <div id="appShell" class="app-shell">
    <!-- 左侧工作室导航栏 -->
    <aside class="sidebar" aria-label="工作室主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 4.7L19 9.5l-4.1 3.1 1.3 4.9L12 14.8l-4.2 2.7 1.3-4.9L5 9.5l5.1-1.8L12 3z"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>织章</strong>
          <small>StoryWeave · 创作书房</small>
        </div>
      </div>

      <!-- 作品切换器 -->
      <div class="book-switcher-wrap">
        <button id="bookSwitcherBtn" class="book-switcher" type="button" aria-expanded="false">
          <div id="activeBookSpine" class="mini-spine" style="background:linear-gradient(155deg,#353B5E,#1E2136)">月</div>
          <div class="book-switcher-info">
            <small>当前作品</small>
            <strong id="activeBookTitle">月光便利店</strong>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="bookDropdown" class="book-dropdown" role="menu"></div>
      </div>

      <!-- 主画布导航（零弹窗） -->
      <nav class="nav">
        <button class="nav-item active" data-route="home" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>工作室</span>
        </button>
        <button class="nav-item" data-route="write" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>写作</span>
          <span class="nav-count" id="navChapterCount">5 章</span>
        </button>
        <button class="nav-item" data-route="plan" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h6M8 17h4"/></svg>
          <span>章节规划</span>
          <span class="nav-badge" id="navReviewBadge">2 待审</span>
        </button>

        <div class="nav-section-label">故事世界</div>
        <button class="nav-item" data-route="codex" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>故事设定</span>
        </button>
        <button class="nav-item" data-route="graph" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M10.5 7.2L6.3 15.8M13.5 7.2l4.2 8.6M7.5 18h9"/></svg>
          <span>关系画布</span>
        </button>
        <button class="nav-item" data-route="timeline" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>时间线与事件</span>
        </button>
        <button class="nav-item" data-route="workshop" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
          <span>灵感与技能库</span>
        </button>
      </nav>

      <!-- 底部克制工具区 -->
      <div class="sidebar-bottom">
        <button id="cmdTriggerBtn" class="nav-item" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <span>快速查找</span>
          <span class="nav-count">Ctrl K</span>
        </button>
        <button id="backupModalBtn" class="nav-item" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>备份与模型连接</span>
        </button>
        <div class="sidebar-status">
          <span class="dot-live"></span>
          <span>本地作品库 · 自动留存</span>
        </div>
      </div>
    </aside>

    <!-- 右侧全幅主画布 -->
    <main class="main-stage">
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggleSidebarBtn" class="icon-btn" type="button" title="收起 / 展开侧边栏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
          <div id="topbarBreadcrumb" class="breadcrumb"></div>
          <div id="topbarSubtabs" class="subtabs"></div>
        </div>
        <div class="topbar-right">
          <span id="saveStatusPill" class="save-pill"><span class="dot-live"></span>已保存 · 21:08</span>
          <button id="themeCycleBtn" class="theme-pill" type="button" title="点击切换工作室配色">
            <span class="theme-dot"></span>
            <span id="themeNameLabel">莓果奶霜</span>
          </button>
          <div id="topbarExtraActions" style="display:flex;gap:8px;align-items:center;"></div>
        </div>
      </header>

      <!-- 主画布挂载节点 -->
      <div id="stageContainer" class="stage-full"></div>
    </main>
  </div>

  <!-- 极简弹窗容器（仅承载新建作品 / 命令面板 / 备份与模型） -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
